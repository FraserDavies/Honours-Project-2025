<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt Chart Builder - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../CSS/styles.css">
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <div class="logo-mark">G</div>
            <div>
                <div class="header-title">Gantt Chart Builder</div>
                <div class="header-subtitle">Heriot-Watt University</div>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="login-card">
            <!-- Login Form -->
            <div id="loginSection" class="login-form">
                <div class="card-header">
                    <h1>Welcome Back</h1>
                    <p>Sign in with your university email</p>
                </div>
                <div class="card-body">
                    <div id="message" class="message"></div>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <label class="form-label" for="email">Email Address</label>
                            <div class="input-wrapper">
                                <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
                                    <polyline points="22,6 12,13 2,6"/>
                                </svg>
                                <input 
                                    type="email" 
                                    id="email" 
                                    class="form-input" 
                                    placeholder="your.email@hw.ac.uk"
                                    autocomplete="email"
                                    required
                                >
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary" id="loginBtn">
                            <span id="btnText">Sign In</span>
                            <div class="spinner" id="btnSpinner" style="display: none;"></div>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Dashboard (shown after login) -->
            <div id="dashboardSection" class="dashboard">
                <div class="welcome-section">
                    <div class="user-avatar" id="userInitials">DD</div>
                    <h2 class="welcome-name" id="userName">DUMMY DATA</h2>
                    <p class="welcome-email" id="userEmail">DUMMY@hw.ac.uk</p>
                    <div class="project-badge">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                        Project ID: <span id="userProjectId">67</span>
                    </div>
                    
                    <div class="divider"></div>
                    
                    <p style="color: var(--text-muted); margin-bottom: 1rem;">
                        You're now logged in and can access the Gantt Chart Builder.
                    </p>
                    
                    <button class="btn btn-secondary" id="logoutBtn">
                        Sign Out
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        © 2025 Heriot-Watt University - Honours Project
    </footer>

    <script src="../../JS/login-system.js"></script>
</body>
</html>
